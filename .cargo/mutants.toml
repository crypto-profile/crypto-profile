additional_cargo_args = ["--all-features"]
test_workspace = true
exclude_globs = [
  # Test infrastructure compiled only under `test-support`, never shipped behaviour (spec §9 excludes test-support helpers).
  "crypto-profile-awslc4/src/test_support.rs",
  # The conformance macro's scaffolding (vector parsers), compiled only under `conformance` (spec §9).
  "crypto-profile/src/conformance/**",
]
exclude_re = [
  # The decision is fips_result, tested both ways; the wrapper's only input is the loaded module's FIPS_mode(), which a FIPS build cannot make false (spec §9, decision 0003).
  "^crypto-profile-awslc4/src/fips\\.rs:[0-9]+:[0-9]+: replace assert_fips_module -> Result<\\(\\), CryptoError> with Ok\\(\\(\\)\\)$",
  # Every 4.x cell is available, so ensure's Ok(()) mutant is equivalent on this backend. The refusal branch is ensure_available, tested in core (ensure_available_refuses_ml_dsa_on_3x), and round 3's -awslc3 conformance run exercises it for real.
  "^crypto-profile-awslc4/src/lib\\.rs:[0-9]+:[0-9]+: replace ensure -> Result<\\(\\), CryptoError> with Ok\\(\\(\\)\\)$",
  # Every test process runs in FIPS mode, so fips() is true either way (decision 0003); the false mutant is caught by the_module_is_in_fips_mode_on_this_build.
  "^crypto-profile-awslc4/src/\\.\\./\\.\\./crypto-profile/src/provider/assembly\\.rs:[0-9]+:[0-9]+: replace fips -> bool with true$",
  # MlKem::fips is the module's FIPS mode, true in every test process (decision 0003); false is caught by fips_follows_rustls_classification.
  "^crypto-profile-awslc4/src/\\.\\./\\.\\./crypto-profile/src/provider/kx\\.rs:[0-9]+:[0-9]+: replace <impl SupportedKxGroup for MlKem>::fips -> bool with true$",
  # Every hybrid's first group is FIPS in every test process, so Hybrid::fips is true either way (decision 0003); false is caught by fips_follows_rustls_classification.
  "^crypto-profile-awslc4/src/\\.\\./\\.\\./crypto-profile/src/provider/kx\\.rs:[0-9]+:[0-9]+: replace <impl SupportedKxGroup for Hybrid>::fips -> bool with true$",
  # Hash::fips is the module's FIPS mode, true in every test process (decision 0003); false is caught by sha2_of_abc_and_the_streaming_paths_agree.
  "^crypto-profile-awslc4/src/\\.\\./\\.\\./crypto-profile/src/provider/hash\\.rs:[0-9]+:[0-9]+: replace <impl crypto::hash::Hash for Hash>::fips -> bool with true$",
  # GcmAead::fips is the module's FIPS mode, true in every test process (decision 0003); false is caught by the_suites_carry_rustls_constants and an_approved_only_policy_is_fips_and_x25519_or_chacha_is_not.
  "^crypto-profile-awslc4/src/\\.\\./\\.\\./crypto-profile/src/provider/tls13\\.rs:[0-9]+:[0-9]+: replace <impl Tls13AeadAlgorithm for GcmAead>::fips -> bool with true$",
  # AwsLcHkdf::fips is the module's FIPS mode, true in every test process (decision 0003); false is caught by the_suites_carry_rustls_constants and an_approved_only_policy_is_fips_and_x25519_or_chacha_is_not.
  "^crypto-profile-awslc4/src/\\.\\./\\.\\./crypto-profile/src/provider/tls13\\.rs:[0-9]+:[0-9]+: replace <impl Hkdf for AwsLcHkdf>::fips -> bool with true$",
  # GcmAlgorithm::fips is the module's FIPS mode, true in every test process (decision 0003); false is caught by the_suites_carry_rustls_constants and tls12_fips_config_requires_ems.
  "^crypto-profile-awslc4/src/\\.\\./\\.\\./crypto-profile/src/provider/tls12\\.rs:[0-9]+:[0-9]+: replace <impl Tls12AeadAlgorithm for GcmAlgorithm>::fips -> bool with true$",
  # Tls12Prf::fips is the module's FIPS mode, true in every test process (decision 0003); false is caught by the_suites_carry_rustls_constants and tls12_fips_config_requires_ems.
  "^crypto-profile-awslc4/src/\\.\\./\\.\\./crypto-profile/src/provider/tls12\\.rs:[0-9]+:[0-9]+: replace <impl Prf for Tls12Prf>::fips -> bool with true$",
  # Rng::fips is the module's FIPS mode, true in every test process (decision 0003); false is caught by the_random_source_fills_and_two_fills_differ.
  "^crypto-profile-awslc4/src/\\.\\./\\.\\./crypto-profile/src/provider/assembly\\.rs:[0-9]+:[0-9]+: replace <impl SecureRandom for Rng>::fips -> bool with true$",
  # Keys::fips is the module's FIPS mode, true in every test process (decision 0003); false is caught by the_key_provider_loads_through_any_supported_type.
  "^crypto-profile-awslc4/src/\\.\\./\\.\\./crypto-profile/src/provider/assembly\\.rs:[0-9]+:[0-9]+: replace <impl KeyProvider for Keys>::fips -> bool with true$",
  # Verifier::fips is the module's FIPS mode, true in every test process (decision 0003); false is caught by every_static_carries_webpkis_algorithm_identifiers and the_verification_tables_match_the_reference.
  "^crypto-profile-awslc4/src/\\.\\./\\.\\./crypto-profile/src/provider/verify\\.rs:[0-9]+:[0-9]+: replace <impl SignatureVerificationAlgorithm for Verifier>::fips -> bool with true$",
]
