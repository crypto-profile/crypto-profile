version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-patch-days: 5
      semver-minor-days: 5
      semver-major-days: 10
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: build
      include: scope
    groups:
      rustls-ecosystem:
        patterns: ["rustls*", "aws-lc*", "webpki*", "rcgen"]

  - package-ecosystem: cargo
    directory: /crypto-profile-awslc3
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-patch-days: 5
      semver-minor-days: 5
      semver-major-days: 10
    open-pull-requests-limit: 5
    labels: [dependencies, rust, "backend: awslc3"]
    commit-message:
      prefix: build
      include: scope
    groups:
      rustls-ecosystem:
        patterns: ["rustls*", "aws-lc*", "webpki*", "rcgen"]
    # These releases leave the AWS-LC FIPS 3.x line (crypto-profile-awslc3/Cargo.toml pins).
    ignore:
      - dependency-name: aws-lc-rs
        versions: [">=1.18.0"]
      - dependency-name: rcgen
        versions: [">=0.14.10"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
