[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
unmaintained = "all"
yanked = "deny"
unsound = "all"

[bans]
multiple-versions = "warn"
deny = [
  { name = "native-tls" },
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "ring" },
]

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "OpenSSL"]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
